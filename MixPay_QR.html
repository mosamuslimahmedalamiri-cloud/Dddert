<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MixPay - لا يوجد اتصال</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: system-ui, -apple-system, sans-serif;
    background:
        radial-gradient(circle at top, #123b57 0%, transparent 45%),
        #07111f;
    color: white;
}

.card {
    width: 100%;
    max-width: 390px;
    padding: 35px 25px;
    text-align: center;
    border-radius: 28px;
    background: rgba(15, 30, 48, .88);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 25px 60px rgba(0,0,0,.45);
}

.logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 22px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    background: linear-gradient(135deg,#0284c7,#06b6d4);
    box-shadow: 0 10px 30px rgba(2,132,199,.35);
}

h1 {
    font-size: 23px;
    margin-bottom: 12px;
}

p {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 25px;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 30px;
    background: rgba(239,68,68,.12);
    color: #f87171;
    font-size: 13px;
    margin-bottom: 20px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
}

button {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 14px;
    color: white;
    background: linear-gradient(135deg,#0284c7,#0369a1);
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.loading {
    display: none;
    margin-top: 15px;
    color: #38bdf8;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">📡</div>

    <h1>لا يوجد اتصال بالإنترنت</h1>

    <p>
        يبدو أن جهازك غير متصل بالإنترنت.
        تحقق من الشبكة، وسيتم فتح MixPay تلقائيًا عند عودة الاتصال.
    </p>

    <div class="status">
        <span class="dot"></span>
        <span id="statusText">غير متصل</span>
    </div>

    <button onclick="checkConnection()">
        🔄 إعادة المحاولة
    </button>

    <div class="loading" id="loading">
        جاري التحقق من الاتصال...
    </div>

</div>

<script>

const MIXPAY_URL =
"https://mosamuslimahmedalamiri-cloud.github.io/MixPay-2-/";

let checking = false;


/* فحص الاتصال */

function checkConnection() {

    if (checking) return;

    checking = true;

    document.getElementById("loading").style.display = "block";

    document.getElementById("statusText").innerText =
        "جاري الفحص...";


    fetch(
        MIXPAY_URL + "?connection=" + Date.now(),
        {
            method: "HEAD",
            cache: "no-store"
        }
    )

    .then(function(response) {

        if (!response.ok) {
            throw new Error("offline");
        }

        connected();

    })

    .catch(function() {

        disconnected();

    });

}


/* الاتصال رجع */

function connected() {

    checking = false;

    document.getElementById("loading").style.display =
        "none";

    document.getElementById("statusText").innerText =
        "تم الاتصال ✓";

    setTimeout(function() {

        window.location.href = MIXPAY_URL;

    }, 500);

}


/* لا يوجد اتصال */

function disconnected() {

    checking = false;

    document.getElementById("loading").style.display =
        "none";

    document.getElementById("statusText").innerText =
        "غير متصل";

}


/* زر إعادة المحاولة */

function retry() {
    checkConnection();
}


/* عند عودة اتصال الجهاز */

window.addEventListener("online", function() {

    checkConnection();

});


/* إذا انقطع */

window.addEventListener("offline", function() {

    disconnected();

});


/*
فحص تلقائي كل 5 ثواني
*/

setInterval(function() {

    checkConnection();

}, 5000);

</script>

</body>
</html>
