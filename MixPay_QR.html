<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MixPay Calculator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    background:#07111f;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    color:white;
}

.calculator{
    width:100%;
    max-width:390px;
    background:#0f1b2d;
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    padding:18px;
    box-shadow:0 25px 60px rgba(0,0,0,.5);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.logo{
    font-size:20px;
    font-weight:800;
    color:#38bdf8;
}

.title{
    color:#94a3b8;
    font-size:13px;
}

.display{
    background:#07111f;
    border-radius:20px;
    padding:18px;
    min-height:125px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    text-align:left;
    direction:ltr;
    overflow:hidden;
    margin-bottom:15px;
}

.expression{
    color:#64748b;
    font-size:18px;
    min-height:28px;
    overflow:hidden;
    white-space:nowrap;
}

.result{
    font-size:38px;
    font-weight:700;
    margin-top:5px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.keys{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    height:68px;
    border:0;
    border-radius:18px;
    background:#17263b;
    color:#fff;
    font-size:21px;
    font-weight:600;
    cursor:pointer;
    transition:.12s;
}

button:active{
    transform:scale(.94);
}

.operator{
    background:#075985;
}

.equal{
    background:linear-gradient(135deg,#0284c7,#06b6d4);
}

.clear{
    background:#7f1d1d;
}

.delete{
    background:#334155;
}

.zero{
    grid-column:span 2;
}
</style>
</head>

<body>

<div class="calculator">

    <div class="header">
        <div class="logo">MixPay</div>
        <div class="title">حاسبة</div>
    </div>

    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>

    <div class="keys">

        <button class="clear" onclick="clearAll()">AC</button>
        <button class="delete" onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="percent()">%</button>
        <button class="operator" onclick="operator('/')">÷</button>

        <button onclick="number('7')">7</button>
        <button onclick="number('8')">8</button>
        <button onclick="number('9')">9</button>
        <button class="operator" onclick="operator('*')">×</button>

        <button onclick="number('4')">4</button>
        <button onclick="number('5')">5</button>
        <button onclick="number('6')">6</button>
        <button class="operator" onclick="operator('-')">−</button>

        <button onclick="number('1')">1</button>
        <button onclick="number('2')">2</button>
        <button onclick="number('3')">3</button>
        <button class="operator" onclick="operator('+')">+</button>

        <button class="zero" onclick="number('0')">0</button>
        <button onclick="decimal()">.</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>

</div>

<script>

let current = "";
let previous = "";
let selectedOperator = null;

const result = document.getElementById("result");
const expression = document.getElementById("expression");


function updateDisplay(){

    result.textContent = current || "0";

    if(previous && selectedOperator){

        expression.textContent =
            previous + " " +
            displayOperator(selectedOperator);

    }else{

        expression.textContent = "";

    }
}


function number(num){

    if(current === "0"){
        current = num;
    }else{
        current += num;
    }

    updateDisplay();
}


function decimal(){

    if(!current.includes(".")){
        current += current ? "." : "0.";
    }

    updateDisplay();
}


function operator(op){

    if(current === "" && previous === ""){
        return;
    }

    if(current !== ""){

        if(previous !== "" && selectedOperator){
            calculate();
        }

        previous = current;
        current = "";
    }

    selectedOperator = op;

    updateDisplay();
}


function calculate(){

    if(!previous || !selectedOperator || !current){
        return;
    }

    let a = parseFloat(previous);
    let b = parseFloat(current);
    let answer;

    switch(selectedOperator){

        case "+":
            answer = a + b;
            break;

        case "-":
            answer = a - b;
            break;

        case "*":
            answer = a * b;
            break;

        case "/":

            if(b === 0){
                result.textContent = "خطأ";
                current = "";
                previous = "";
                selectedOperator = null;
                return;
            }

            answer = a / b;
            break;
    }

    answer =
        Math.round((answer + Number.EPSILON) * 100000000) /
        100000000;

    current = String(answer);

    previous = "";
    selectedOperator = null;

    expression.textContent = "";
    result.textContent = current;
}


function percent(){

    if(current === ""){
        return;
    }

    current = String(
        parseFloat(current) / 100
    );

    updateDisplay();
}


function deleteLast(){

    current = current.slice(0,-1);

    updateDisplay();
}


function clearAll(){

    current = "";
    previous = "";
    selectedOperator = null;

    updateDisplay();
}


function displayOperator(op){

    if(op === "+") return "+";
    if(op === "-") return "−";
    if(op === "*") return "×";
    if(op === "/") return "÷";

    return op;
}


/* دعم لوحة مفاتيح الهاتف/الكمبيوتر */

document.addEventListener("keydown", function(e){

    if(e.key >= "0" && e.key <= "9"){
        number(e.key);
    }

    if(e.key === "."){
        decimal();
    }

    if(["+","-","*","/"].includes(e.key)){
        operator(e.key);
    }

    if(e.key === "Enter" || e.key === "="){
        calculate();
    }

    if(e.key === "Backspace"){
        deleteLast();
    }

    if(e.key === "Escape"){
        clearAll();
    }

    if(e.key === "%"){
        percent();
    }

});

</script>

</body>
</html>
